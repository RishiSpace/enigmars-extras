# Pacman repository for Enigmars extras (Utils and other userspace packages).
# Copy to /etc/pacman.d/enigmars-extras.conf and Include it from pacman.conf.
#
# GitHub Releases are the $0 mirror. Every published Latest release MUST
# include enigmars-extras.db as a regular file (not a symlink).

[enigmars-extras]
SigLevel = Optional TrustAll
Server = https://github.com/enigmars-project/enigmars-extras/releases/latest/download

# After ./scripts/build-all.sh:
# Server = file:///home/rishi/Git-Repos/enigmars-extras/repo/x86_64
